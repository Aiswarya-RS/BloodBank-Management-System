{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">

{% if messages %}
    <ul style="list-style: none; padding: 0;">
        {% for message in messages %}
            <li style="background-color: #d4edda; color: #155724; padding: 10px; margin: 10px auto; width: 50%; border: 1px solid #c3e6cb; border-radius: 5px;">
                {{ message }}
            </li>
        {% endfor %}
    </ul>
{% endif %}


<h2>Welcome to Blood Bank Management System</h2>
<a href="{% url 'logout' %}">Logout</a>
<a href="{% url 'request_blood' %}">Request Blood</a>

<a href="{% url 'view_requests' %}">View All Requests</a>
